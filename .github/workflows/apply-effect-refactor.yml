name: Apply Effect v4 refactor

on:
  push:
    branches:
      - refactor/effect-v4-architecture
    paths:
      - ".github/workflows/apply-effect-refactor.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/effect-v4-architecture
          fetch-depth: 0

      - name: Apply staged refactor archive
        shell: bash
        run: |
          set -euo pipefail
          cat .refactor/effect-refactor.b64.part* | base64 --decode > /tmp/effect-refactor.tar.gz
          echo "19fd5dd2c272658d81eb2f4e85fbeb935823965bd6ba345a0f5d16831f8ce1e0  /tmp/effect-refactor.tar.gz" | sha256sum -c -
          tar -xzf /tmp/effect-refactor.tar.gz
          git rm -f worker/src/auth.ts worker/src/http.ts || true
          rm -f .tmp-tree-test .tmp-tree-test-2 .tmp-tree-test-3 .tmp-tree-test-4 .tmp-tree-test-5 .tmp-tree-test-6
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refactor backend to idiomatic Effect v4 architecture"
          git push origin HEAD:refactor/effect-v4-architecture
