name: Mark v1.2 parity PR ready

on:
  push:
    branches: [feature/boop-1.2-parity]

permissions:
  pull-requests: write

jobs:
  ready:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 2 --repo "$GITHUB_REPOSITORY"
