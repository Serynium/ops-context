name: Apply Effect v4 API fixes

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-effect-v4.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Replace renamed Effect recovery combinator
        shell: bash
        run: |
          sed -i 's/Effect\.catchAll/Effect.catch/g' worker/src/*.ts
          rm .github/workflows/fix-effect-v4.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Effect v4 recovery combinators"
          git push origin HEAD:main
