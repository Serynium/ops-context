name: Finalize strict event contracts

on:
  push:
    branches: [contracts/strict-event-schema]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: contracts/strict-event-schema
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Verify implementation is present
        run: |
          grep -q 'CreateEventInputSchema' worker/src/event-contract.ts
          grep -q 'decodeCreateEventInput' worker/src/events.ts
          grep -q 'MAX_EVENT_REQUEST_BYTES' worker/src/index.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Remove branch-only automation
        run: |
          rm -f .github/workflows/implement-issue-6.yml
          rm -f .github/workflows/finalize-issue-6.yml
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: remove strict-contract branch automation"
            git push
          fi
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge 27 --repo Serynium/ops-context --squash --delete-branch
