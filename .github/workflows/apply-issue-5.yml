name: Apply bounded retry implementation

on:
  push:
    branches: [reliability/bounded-push-retries]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/bounded-push-retries
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          cat > /tmp/issue.patch.gz.b64 <<'PATCH'

PATCH
          base64 --decode /tmp/issue.patch.gz.b64 | gzip --decompress > /tmp/issue.patch
          git apply --index /tmp/issue.patch
          git rm .github/workflows/apply-issue-5.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bound Web Push retries and terminal delivery state"
          git push
