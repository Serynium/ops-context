name: Capture refactor CI output

on:
  push:
    branches:
      - refactor/effect-v4-architecture
    paths:
      - ".github/workflows/capture-refactor-ci.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/effect-v4-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Capture check output
        shell: bash
        run: |
          set +e
          pnpm install --no-frozen-lockfile > /tmp/install.log 2>&1
          install_code=$?
          if [ "$install_code" -eq 0 ]; then
            pnpm check > /tmp/check.log 2>&1
            check_code=$?
          else
            check_code=99
            cp /tmp/install.log /tmp/check.log
          fi
          mkdir -p .ci
          {
            echo "install_exit=$install_code"
            echo "check_exit=$check_code"
            echo
            cat /tmp/check.log
          } > .ci/refactor-check.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/refactor-check.log
          git commit -m "Capture refactor CI output" || true
          git push origin HEAD:refactor/effect-v4-architecture
