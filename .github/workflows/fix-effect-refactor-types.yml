name: Fix Effect refactor type contracts

on:
  push:
    branches:
      - refactor/effect-v4-architecture

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip effect-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/effect-v4-architecture
      - name: Normalize Effect boundary types
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          targets = [
              "worker/src/events.ts",
              "worker/src/projects.ts",
              "worker/src/subscriptions.ts",
              "worker/src/silences.ts",
              "worker/src/settings.ts",
              "worker/src/application.ts",
          ]
          for path in targets:
              file = Path(path)
              text = file.read_text()
              text = re.sub(r"(?: \| undefined){2,}", " | undefined", text)
              file.write_text(text)

          events = Path("worker/src/events.ts")
          text = events.read_text().replace("Effect.catchAll(", "Effect.catch(")
          events.write_text(text)

          subscriptions = Path("worker/src/subscriptions.ts")
          text = subscriptions.read_text()
          text = re.sub(
              r"patch: \{ readonly name\?: string \| undefined; readonly enabled\?: boolean(?: \| undefined)? \}",
              "patch: { readonly name?: string | undefined; readonly enabled?: boolean | undefined }",
              text,
          )
          subscriptions.write_text(text)

          index = Path("worker/src/index.ts")
          text = index.read_text()
          text = text.replace(
              """interface IsolateRuntime {
            readonly db: D1Database
            readonly queue: Queue<PushJobMessage>
            readonly http: ReturnType<typeof HttpRouter.toWebHandler>
            readonly programs: ManagedRuntime.ManagedRuntime<PushDelivery | Maintenance, never>
          }""",
              """interface WebHandler {
            readonly handler: (request: Request) => Promise<Response>
            readonly dispose: () => Promise<void>
          }

          interface IsolateRuntime {
            readonly db: D1Database
            readonly queue: Queue<PushJobMessage>
            readonly http: WebHandler
            readonly programs: ManagedRuntime.ManagedRuntime<PushDelivery | Maintenance, never>
          }""",
          )
          index.write_text(text)
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize Effect v4 boundary types [skip effect-fix]"
          git push origin HEAD:refactor/effect-v4-architecture
