name: Finalize bounded push retries

on:
  push:
    branches: [reliability/bounded-push-retries]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/bounded-push-retries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Verify implementation is present
        run: |
          grep -q 'export const preparePushRetry' worker/src/push.ts
          grep -q 'retry_scheduled_until' migrations/0004_bounded_push_retries.sql
          grep -q 'OPS_PUSH_MAX_ATTEMPTS' worker/src/types.ts
          grep -q 'preparePushRetry' worker/src/index.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Remove branch-only automation and status marker
        run: |
          rm -f .github/workflows/implement-issue-5.yml
          rm -f .github/workflows/finalize-issue-5.yml
          rm -f .github/issue-5-status.md
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: remove bounded retry branch automation"
            git push
          fi
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge 26 --repo Serynium/ops-context --squash --delete-branch
